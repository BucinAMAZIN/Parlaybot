name: Test site

on:
  push:
    branches:
      - cursor/parlaybot-v1-2c2d
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  allow-branch:
    runs-on: ubuntu-latest
    permissions:
      administration: write
    steps:
      - name: Let this branch deploy to github-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/environments/github-pages/deployment-branch-policies" \
            -f name="${{ github.ref_name }}" -f type=branch \
            || echo "Branch policy was not added (it may already exist). Deploy will try anyway."
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /Parlaybot/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: [build, allow-branch]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
